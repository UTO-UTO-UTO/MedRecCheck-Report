<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #f4f7fb 0%, #e8eef7 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1f2a37;
  }
  .card {
    width: min(92vw, 420px); padding: 28px 28px 24px; border-radius: 14px;

  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input[type="password"] {
    width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 8px;
    font-size: 15px; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input[type="password"]:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  button {
    width: 100%; margin-top: 14px; padding: 11px 12px; border: 0; border-radius: 8px;
    background: #2563eb; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .msg { min-height: 20px; margin-top: 12px; font-size: 13px; color: #dc2626; }
  .tip { margin-top: 16px; font-size: 12px; color: #98a2b3; line-height: 1.5; }
</style>

  function decodeBase64(value) {
    const binary = atob(value);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  async function decryptReport(password) {
    const encoder = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw', encoder.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: decodeBase64(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
    const ciphertext = decodeBase64(PAYLOAD.ciphertext);
    const tag = decodeBase64(PAYLOAD.tag);
    const combined = new Uint8Array(ciphertext.length + tag.length);
    combined.set(ciphertext, 0);
    combined.set(tag, ciphertext.length);
    const plaintext = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: decodeBase64(PAYLOAD.iv), tagLength: 128 }, key, combined
    );
    return new TextDecoder().decode(plaintext);
  }

  const form = document.getElementById('form');
  const passwordInput = document.getElementById('password');
  const submitButton = document.getElementById('submit');
  const message = document.getElementById('msg');

  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    message.textContent = '';
    if (!window.isSecureContext || !window.crypto || !window.crypto.subtle) {
      message.textContent = '当前环境不支持浏览器解密，请通过 https 访问本页面。';
      return;
    }
    submitButton.disabled = true;
    submitButton.textContent = '解密中…';
    try {
      const html = await decryptReport(passwordInput.value);
      document.body.innerHTML = '';
      const frame = document.createElement('iframe');
      frame.title = '病历质量督查报告';
      frame.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff';
      frame.srcdoc = html;
      document.body.appendChild(frame);
    } catch (error) {
      message.textContent = '密码不正确，或文件已损坏。';
      submitButton.disabled = false;
      submitButton.textContent = '查看报告';
      passwordInput.select();
    }
  });
